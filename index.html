<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小萌馬金庫</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小萌馬金庫">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF3F1">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
.login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:14px}
.login h2{margin:0}
.who{font-size:12.5px;color:var(--muted);align-self:center}
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface2:#F5F8F7; --line:#D5E0DD; --ink:#16302B; --muted:#5C736E;
  --accent:#0E6B63; --accent-ink:#FFFFFF; --accent-soft:#DCEEEB;
  --in:#1E7A46; --out:#B23A2E; --tr:#A86400; --in-soft:#E1F2E7; --out-soft:#F8E4E1; --tr-soft:#F7ECD9;
  --f1:#0E6B63; --f2:#7A4DB0; --f3:#C2572B; --f0:#6B7D79;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1916; --surface:#162420; --surface2:#1B2C28; --line:#2A3F3A; --ink:#E3EEEB; --muted:#93A9A4;
  --accent:#4DB6A9; --accent-ink:#0B1A17; --accent-soft:#1D3934;
  --in:#62CD8F; --out:#F07D6F; --tr:#E8AC4E; --in-soft:#193628; --out-soft:#3A201D; --tr-soft:#3A2D16;
  --f1:#4DB6A9; --f2:#B596E6; --f3:#EE8C5F; --f0:#93A9A4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1916; --surface:#162420; --surface2:#1B2C28; --line:#2A3F3A; --ink:#E3EEEB; --muted:#93A9A4;
  --accent:#4DB6A9; --accent-ink:#0B1A17; --accent-soft:#1D3934;
  --in:#62CD8F; --out:#F07D6F; --tr:#E8AC4E; --in-soft:#193628; --out-soft:#3A201D; --tr-soft:#3A2D16;
  --f1:#4DB6A9; --f2:#B596E6; --f3:#EE8C5F; --f0:#93A9A4;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 16px 48px}
.wrap{max-width:1080px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.neg{color:var(--out)!important}
.muted{color:var(--muted)}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 16px}
header.top h1{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:1.1}
header.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.small{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:500;padding:0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}

.notice{background:var(--tr-soft);border:1px solid var(--tr);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.notice b{color:var(--tr)}

h2{font-family:var(--display);font-size:20px;margin:0 0 10px;font-weight:700}
.section{margin-bottom:26px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sechead h2{margin:0}
.sechead .hint{font-size:13px;color:var(--muted)}

/* hero: 宣穆的錢 */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:minmax(200px,1fr) 2.2fr;gap:18px;margin-bottom:16px}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.hero .total .lbl{font-size:13px;color:var(--muted)}
.hero .total .big{font-size:34px;font-weight:600;line-height:1.2;margin-top:2px}
.hero .total .split{margin-top:10px;display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.hero .total .split i{display:block;height:100%}
.hero .total .foot{font-size:12.5px;color:var(--muted);margin-top:8px}
.funds{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fund{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;position:relative}
.fund:hover{border-color:var(--fc)}
.fund::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--fc)}
.fund .fn{font-weight:700;font-size:14px}
.fund .fb{font-size:22px;font-weight:600}
.fund .fs{font-size:12px;color:var(--muted);line-height:1.45}
.bar{height:7px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--fc,var(--accent))}

/* actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:760px){.actions{grid-template-columns:1fr 1fr}}
.act{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;min-height:74px}
.act:hover{border-color:var(--accent);background:var(--accent-soft)}
.act .ic{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;font-family:var(--display)}
.act .ic.in{background:var(--in-soft);color:var(--in)} .act .ic.tr{background:var(--tr-soft);color:var(--tr)} .act .ic.out{background:var(--out-soft);color:var(--out)} .act .ic.st{background:var(--accent-soft);color:var(--accent)}
.act b{display:block;font-size:15.5px}
.act span{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.actmore{margin-top:8px;text-align:right}

/* accounts */
.accgroup{margin-bottom:14px}
.glbl{font-size:12.5px;color:var(--muted);letter-spacing:.05em;margin:0 0 6px}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.acc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.acc .ah{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.acc .an{font-weight:700;font-size:14px;border:0;background:none;padding:0;text-align:left}
.acc .an:hover{color:var(--accent)}
.acc .ab{font-size:20px;font-weight:600}
.acc .al{font-size:12px;color:var(--muted)}
.acc .fl{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.acc .fl div{display:flex;justify-content:space-between;gap:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--fc)}
.recon{border-top:1px dashed var(--line);padding-top:6px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.recon div{display:flex;justify-content:space-between;gap:8px}

/* ledger */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:14px;min-width:0}
.filters input{width:150px}
.chipfilter{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:99px;padding:3px 4px 3px 12px;font-size:13px}
.chipfilter button{border:0;background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:2px 6px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.month{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 16px;background:var(--surface2);border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.book .month:first-child{border-top:0}
.month b{font-family:var(--display);color:var(--ink);font-size:15px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:start;padding:11px 16px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .d{font-family:var(--num);font-size:13.5px;color:var(--muted);padding-top:2px}
.row .main{min-width:0}
.row .note{font-weight:500;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.tag{border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700}
.tag.in{background:var(--in-soft);color:var(--in)} .tag.out{background:var(--out-soft);color:var(--out)} .tag.tr{background:var(--tr-soft);color:var(--tr)} .tag.st{background:var(--accent-soft);color:var(--accent)}
.pill{border:1px solid var(--line);border-radius:6px;padding:0 6px;display:inline-flex;align-items:center}
.row .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.row .amt{font-size:16px;font-weight:600;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--out)} .amt.tr{color:var(--tr)}
.row .run{font-size:12px;color:var(--muted);white-space:nowrap}
.row .acts{display:flex;gap:2px}
.row .acts button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:2px 6px;border-radius:6px}
.row .acts button:hover{background:var(--surface2);color:var(--ink)}
.row .acts button.del:hover{color:var(--out)}
.row.confirm{background:var(--out-soft)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:540px;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet .sh{position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);z-index:1}
.sheet .sh h3{margin:0;font-family:var(--display);font-size:21px}
.sheet .sb{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.sheet .sf{position:sticky;bottom:0;background:var(--surface);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:600px){.scrim{align-items:flex-end;padding:0}.sheet{border-radius:16px 16px 0 0;max-height:94%}}
.f{display:flex;flex-direction:column;gap:6px}
.f>label,.f>.lb{font-size:13px;color:var(--muted);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.f input.big{font-family:var(--num);font-size:26px;font-weight:600;padding:8px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 12px;font-size:14px;text-align:left;line-height:1.3}
.chip small{display:block;font-size:11.5px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.85}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.callout{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px}
.err{color:var(--out);font-size:13px}
.kv{display:flex;flex-direction:column;gap:4px;font-size:14px}
.kv div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv div:last-child{border-bottom:0}
.subh{font-size:14px;font-weight:700;margin:0}
.setrow{display:grid;grid-template-columns:1.3fr 1fr auto;gap:8px;align-items:center}
.setrow input,.setrow select{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:7px 9px;width:100%;min-width:0;font-size:14px}
.setlist{display:flex;flex-direction:column;gap:10px}
.setsec{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.importbox{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(12px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="appTitle">小萌馬金庫</h1>
      <div class="sub" id="appSub">育兒資金帳本・手機電腦同一份資料</div>
    </div>
    <div class="toolbar" id="toolbar" hidden>
      <button class="btn" id="btnTrash">垃圾桶 <span id="trashCount" class="num"></span></button>
      <button class="btn" id="btnBackup">備份</button>
      <button class="btn" id="btnSettings">設定</button>
      <button class="btn ghost" id="btnOut">登出</button>
    </div>
  </header>

  <div id="status" class="loading">正在讀取帳本…</div>
  <form class="login" id="login" hidden>
    <h2>登入小萌馬金庫</h2>
    <p class="hint">用你在 Firebase 建立的 Email 和密碼登入。登入一次之後，這台裝置會記住你。</p>
    <div class="f"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
    <div class="f"><label for="lPw">密碼</label><input id="lPw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lErr" role="alert"></div>
    <button class="btn primary" id="lGo" type="submit">登入</button>
  </form>

  <main id="app" hidden>
    <div id="warnings"></div>
    <section class="hero" id="hero"></section>

    <section class="section" id="actSec">
      <div class="actions" id="actions"></div>
      <div class="actmore"><button class="linkbtn" id="btnTransfer">帳戶之間轉帳・借出／收回</button></div>
    </section>

    <section class="section">
      <div class="sechead"><h2>帳戶</h2><span class="hint">點帳戶名稱看它的存摺明細</span></div>
      <div id="accounts"></div>
    </section>

    <section class="section" id="ledger">
      <div class="sechead">
        <h2 id="ledTitle">收支明細</h2>
        <div class="filters">
          <span id="activeChips"></span>
          <select id="fMonth" aria-label="月份"></select>
          <input id="fQ" type="search" placeholder="搜尋備註" aria-label="搜尋備註">
        </div>
      </div>
      <div class="book" id="book"></div>
    </section>
  </main>
</div>
<div id="sheetHost"></div>
<div id="toastHost"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc as fsDoc,collection as fsCol,setDoc,deleteDoc,onSnapshot as fsSnap,query,limit as fsLimit} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import {FIREBASE_CONFIG} from "./firebase-config.js";
(function(){
"use strict";
const $=s=>document.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>{n=Math.round(Number(n)||0);return (n<0?"-$":"$")+Math.abs(n).toLocaleString("zh-TW")};
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const roc=y=>Number(y)-1911;
const rocMonth=ym=>`${roc(ym.slice(0,4))}/${Number(ym.slice(5,7))}`;
const md=d=>`${Number(d.slice(5,7))}/${Number(d.slice(8,10))}`;
const clone=o=>JSON.parse(JSON.stringify(o||{}));
const docBody=o=>{const c=clone(o);delete c.id;return c};

const S={db:null,cfgRef:null,cfg:null,tx:new Map(),loadedCfg:false,loadedTx:false,canWrite:true,
  f:{acc:"",fund:"",month:"",q:""},confirmDel:null,st:null};

/* ---------- model ---------- */
const accounts=()=>(S.cfg&&S.cfg.accounts)||[];
const funds=()=>(S.cfg&&S.cfg.funds)||[];
const accById=id=>accounts().find(a=>a.id===id);
const fundById=id=>funds().find(f=>f.id===id);
const kind=id=>{const a=accById(id);return a?a.kind:null};
const isBank=id=>{const k=kind(id);return k==="bank"||k==="loan"};
const label=v=>{const a=accById(v);return a?a.name:(v||"外部")};
const fundName=id=>{const f=fundById(id);return f?f.name:(id?id:"未指定")};
const fundColor=id=>{const i=funds().findIndex(f=>f.id===id);return i<0?"var(--f0)":`var(--f${(i%3)+1})`};
const liveTx=()=>[...S.tx.values()].filter(t=>!t.deleted);
const sortKey=t=>(t.date||"")+"|"+String(t.createdAt||0).padStart(15,"0");
const advanceAcc=()=>accounts().find(a=>a.kind==="advance");
const settleWallet=()=>accById(S.cfg.settleWallet)||accounts().find(a=>a.kind==="wallet");

// What a record is, in plain words
function actionOf(t){
  if(t.type==="收入")return "income";
  if(t.type==="支出")return "spend";
  if(t.type==="轉帳"){
    if(kind(t.to)==="advance")return "settle";
    if(kind(t.to)==="loan")return "lend";
    if(kind(t.from)==="loan")return "repay";
    if(isBank(t.from)&&kind(t.to)==="wallet")return "topup";
    return "transfer";
  }
  return "spend";
}
const ACT={income:{l:"收到錢",c:"in"},topup:{l:"撥零用錢",c:"tr"},spend:{l:"花費",c:"out"},settle:{l:"月底結算",c:"st"},transfer:{l:"轉帳",c:"tr"},lend:{l:"借出",c:"tr"},repay:{l:"收回借款",c:"in"}};

function budgetPeriod(fund){
  const sm=Number(fund&&fund.startMonth)||1;const d=new Date();
  let y=d.getFullYear();if(d.getMonth()+1<sm)y--;
  const start=y+"-"+String(sm).padStart(2,"0")+"-01";
  const ey=sm===1?y:y+1, em=sm===1?12:sm-1;
  return {start,end:ey+"-"+String(em).padStart(2,"0")+"-31",label:`${roc(y)}/${sm} – ${roc(ey)}/${em}`};
}

function compute(){
  const bal={};accounts().forEach(a=>bal[a.id]=0);
  const F={};const ensure=id=>F[id]||(F[id]={in:0,out:0,loc:{},dest:{},yIn:0,yOut:0,mOut:0,moved:{}});
  funds().forEach(f=>ensure(f.id));
  const ym=todayStr().slice(0,7);
  const walletMonth={};
  for(const t of liveTx()){
    const a=Number(t.amount)||0;
    if(t.type==="收入"){if(accById(t.to))bal[t.to]+=a}
    else if(t.type==="支出"){if(accById(t.from))bal[t.from]-=a}
    else{if(accById(t.from))bal[t.from]-=a;if(accById(t.to))bal[t.to]+=a}
    // wallet spending this month (spend + settle out of a wallet)
    if(kind(t.from)==="wallet"&&(t.type==="支出"||kind(t.to)==="advance")&&(t.date||"").startsWith(ym))walletMonth[t.from]=(walletMonth[t.from]||0)+a;
    // fund flows: count money when it enters or leaves the bank accounts
    const fid=t.fund||"_none";const bFrom=isBank(t.from),bTo=isBank(t.to);
    const into=(t.type==="收入"&&bTo)||(t.type==="轉帳"&&!bFrom&&bTo);
    const outOf=(t.type==="支出"&&bFrom)||(t.type==="轉帳"&&bFrom&&!bTo);
    const between=t.type==="轉帳"&&bFrom&&bTo;
    if(!into&&!outOf&&!between)continue;
    const f=ensure(fid);const P=budgetPeriod(fundById(fid));const inY=t.date>=P.start&&t.date<=P.end;
    const loc=(id,v)=>f.loc[id]=(f.loc[id]||0)+v;
    if(into){f.in+=a;loc(t.to,a);if(inY)f.yIn+=a}
    if(outOf){f.out+=a;loc(t.from,-a);if(inY)f.yOut+=a;if((t.date||"").startsWith(ym))f.mOut+=a;
      const k=t.type==="支出"?"直接付款・"+(t.category||"其他"):"撥到 "+label(t.to);f.dest[k]=(f.dest[k]||0)+a}
    if(between){loc(t.from,-a);loc(t.to,a);const k=label(t.to);f.moved[k]=(f.moved[k]||0)+a}
  }
  return {bal,F,walletMonth};
}

/* ---------- render ---------- */
function render(){
  if(!S.loadedCfg||!S.loadedTx)return;
  $("#status").hidden=true;$("#app").hidden=false;$("#toolbar").hidden=false;
  const c=S.cfg;
  $("#appTitle").textContent=c.title||"小萌馬金庫";
  $("#appSub").textContent=(c.child?c.child+"的":"")+"育兒資金帳本・手機電腦同一份資料";
  S.st=compute();
  renderWarnings();renderHero();renderActions();renderAccounts();renderLedger();
  const tc=[...S.tx.values()].filter(t=>t.deleted).length;
  $("#trashCount").textContent=tc?tc:"";
}

function renderWarnings(){
  const {bal}=S.st;let h="";
  if(!S.canWrite)h+=`<div class="notice">你目前只能查看這本帳，無法新增或修改。</div>`;
  if(!accounts().length)h+=`<div class="notice"><b>還沒有資料：</b>第一次使用請匯入備份檔，帳戶、基金和所有紀錄會一起搬進來。 <button class="btn small" data-open="backup">匯入備份檔</button></div>`;
  const neg=accounts().filter(a=>a.kind!=="advance"&&!a.archived&&bal[a.id]<0);
  if(neg.length)h+=`<div class="notice"><b>紀錄上的餘額變成負數：</b>${neg.map(a=>esc(a.name)+" "+money(bal[a.id])).join("、")}。代表有一筆紀錄的帳戶或金額填錯了，點帳戶名稱可以逐筆檢查。</div>`;
  $("#warnings").innerHTML=h;
}

function renderHero(){
  const {F}=S.st;const ids=funds().map(f=>f.id).concat(F._none&&(F._none.in||F._none.out)?["_none"]:[]);
  const rem=id=>F[id]?F[id].in-F[id].out:0;
  const total=ids.reduce((s,id)=>s+rem(id),0);
  const pos=ids.filter(id=>rem(id)>0);const posSum=pos.reduce((s,id)=>s+rem(id),0)||1;
  const cards=ids.map(id=>{
    const f=F[id]||{in:0,out:0,yIn:0,yOut:0,mOut:0};const fd=fundById(id);const P=budgetPeriod(fd);
    let sub;
    if(fd&&fd.yearly){const pct=Math.min(100,Math.round(f.yOut/fd.yearly*100));
      sub=`<div class="bar"><i style="width:${pct}%"></i></div><div class="fs">${P.label} 年度 ${money(fd.yearly)}<br>已用 <span class="num">${money(f.yOut)}</span>・本月 <span class="num">${money(f.mOut)}</span></div>`}
    else sub=`<div class="fs">累計收到 <span class="num">${money(f.in)}</span>・已用 <span class="num">${money(f.out)}</span></div>`;
    return `<button class="fund" style="--fc:${fundColor(id)}" data-fund="${id}"><span class="fn">${esc(fundName(id))}</span><span class="fb num ${rem(id)<0?"neg":""}">${money(rem(id))}</span>${sub}</button>`}).join("");
  $("#hero").innerHTML=`<div class="total"><div class="lbl">屬於${esc(S.cfg.child||"孩子")}的錢（還在銀行帳戶裡）</div><div class="big num">${money(total)}</div>
    <div class="split">${pos.map(id=>`<i style="width:${rem(id)/posSum*100}%;background:${fundColor(id)}"></i>`).join("")}</div>
    <div class="foot">撥進零用錢包的錢算已用掉。點右邊的基金看錢花到哪裡、現在放在哪個帳戶。</div></div><div class="funds">${cards}</div>`;
}

function renderAccounts(){
  const {bal,F,walletMonth}=S.st;
  const byKind=k=>accounts().filter(a=>a.kind===k&&!a.archived);
  const fundLines=id=>{const rows=Object.keys(F).map(fid=>[fid,Math.round(F[fid].loc[id]||0)]).filter(([,v])=>v!==0);
    return rows.length?`<div class="fl">${rows.map(([fid,v])=>`<div><span><span class="dot" style="--fc:${fundColor(fid)}"></span>${esc(fundName(fid))}</span><span class="num ${v<0?"neg":""}">${money(v)}</span></div>`).join("")}</div>`:""};
  const bank=byKind("bank").map(a=>{
    const rec=bal[a.id];let recon="";
    if(a.actual!==undefined&&a.actual!==null&&a.actual!==""){const own=Number(a.actual)-rec;
      recon=`<div class="recon"><div><span>銀行實際餘額（${a.actualDate?md(a.actualDate):""}）</span><span class="num">${money(a.actual)}</span></div><div><span>其中你自己的錢</span><span class="num ${own<0?"neg":""}">${money(own)}</span></div></div>`}
    return `<div class="acc ${S.f.acc===a.id?"on":""}"><div class="ah"><button class="an" data-acc="${a.id}">${esc(a.name)}</button>${S.canWrite?`<button class="btn small" data-recon="${a.id}">${recon?"更新":"對帳"}</button>`:""}</div>
      <div><div class="al">屬於${esc(S.cfg.child||"孩子")}的</div><div class="ab num ${rec<0?"neg":""}">${money(rec)}</div></div>${fundLines(a.id)}${recon||(a.note?`<div class="al">${esc(a.note)}</div>`:"")}</div>`}).join("");
  const wallets=byKind("wallet").map(a=>`<div class="acc ${S.f.acc===a.id?"on":""}"><div class="ah"><button class="an" data-acc="${a.id}">${esc(a.name)}</button></div>
      <div><div class="al">錢包剩餘</div><div class="ab num ${bal[a.id]<0?"neg":""}">${money(bal[a.id])}</div></div><div class="al">本月已記花費 <span class="num">${money(walletMonth[a.id]||0)}</span>${a.note?"・"+esc(a.note):""}</div></div>`).join("");
  const adv=byKind("advance").map(a=>{const owed=-bal[a.id];return `<div class="acc ${S.f.acc===a.id?"on":""}"><div class="ah"><button class="an" data-acc="${a.id}">${esc(a.name)}</button></div>
      <div><div class="al">還沒結算的代墊</div><div class="ab num">${money(Math.max(0,owed))}</div></div><div class="al">${owed>0?"月底按「月底結算」從共同錢包扣回":owed<0?"結算金額比代墊多 "+money(-owed):"目前都結清了"}</div></div>`}).join("");
  const loans=byKind("loan").map(a=>`<div class="acc ${S.f.acc===a.id?"on":""}"><div class="ah"><button class="an" data-acc="${a.id}">${esc(a.name)}</button></div>
      <div><div class="al">還沒還的</div><div class="ab num">${money(bal[a.id])}</div></div>${fundLines(a.id)}${a.note?`<div class="al">${esc(a.note)}</div>`:""}</div>`).join("");
  $("#accounts").innerHTML=
    (bank?`<div class="accgroup"><p class="glbl">銀行帳戶・裡面也有你自己的錢，按「對帳」填銀行 App 上的餘額就能分開</p><div class="accs">${bank}</div></div>`:"")+
    (wallets?`<div class="accgroup"><p class="glbl">零用錢包・撥進來就算用掉，這裡只看還剩多少</p><div class="accs">${wallets}</div></div>`:"")+
    (loans?`<div class="accgroup"><p class="glbl">借出去的錢・還是屬於${esc(S.cfg.child||"孩子")}的，收回時用「帳戶之間轉帳」轉回銀行</p><div class="accs">${loans}</div></div>`:"")+
    (adv?`<div class="accgroup"><p class="glbl">我先墊的錢・刷卡或用我自己的錢包買的</p><div class="accs">${adv}</div></div>`:"");
}

function renderLedger(){
  const f=S.f;
  const months=[...new Set(liveTx().map(t=>(t.date||"").slice(0,7)).filter(Boolean))].sort().reverse();
  $("#fMonth").innerHTML=`<option value="">全部月份</option>`+months.map(m=>`<option value="${m}" ${m===f.month?"selected":""}>${roc(m.slice(0,4))}年${Number(m.slice(5))}月</option>`).join("");
  $("#activeChips").innerHTML=(f.acc?`<span class="chipfilter">${esc(label(f.acc))}<button data-clr="acc" aria-label="取消帳戶篩選">×</button></span> `:"")+(f.fund?`<span class="chipfilter">${esc(fundName(f.fund))}<button data-clr="fund" aria-label="取消基金篩選">×</button></span>`:"");
  $("#ledTitle").textContent=f.acc?label(f.acc)+" 存摺":"收支明細";
  let list=liveTx().sort((a,b)=>sortKey(a)<sortKey(b)?-1:1);
  const run=new Map();
  const eff=(t,id)=>{const a=Number(t.amount)||0;let e=0;if(t.from===id&&t.type!=="收入")e-=a;if(t.to===id&&t.type!=="支出")e+=a;return e};
  if(f.acc){let r=0;list=list.filter(t=>t.from===f.acc||t.to===f.acc);list.forEach(t=>{r+=eff(t,f.acc);run.set(t.id,r)})}
  list.reverse();
  if(f.fund)list=list.filter(t=>(t.fund||"_none")===f.fund);
  if(f.month)list=list.filter(t=>(t.date||"").startsWith(f.month));
  if(f.q){const q=f.q.toLowerCase();list=list.filter(t=>[t.note,t.category,fundName(t.fund),label(t.from),label(t.to)].join(" ").toLowerCase().includes(q))}
  if(!list.length){$("#book").innerHTML=`<div class="empty">${S.tx.size?"沒有符合條件的紀錄":"還沒有任何紀錄"}</div>`;return}
  let h="",lastM="";
  for(const t of list){
    const m=t.date.slice(0,7);
    if(m!==lastM){lastM=m;h+=`<div class="month"><b>${roc(m.slice(0,4))}年${Number(m.slice(5))}月</b></div>`}
    const act=actionOf(t),A=ACT[act];
    let amt,ac=A.c==="st"?"tr":A.c;
    if(f.acc){const e=eff(t,f.acc);amt=(e>=0?"+":"−")+money(Math.abs(e));ac=e>=0?"in":"out"}
    else amt=(t.type==="收入"?"+":t.type==="支出"?"−":"")+money(t.amount);
    const flow=t.type==="收入"?`${esc(label(t.from))} → ${esc(label(t.to))}`:t.type==="支出"?`${esc(label(t.from))} 付`:`${esc(label(t.from))} → ${esc(label(t.to))}`;
    const fundTag=t.fund?`<span class="pill"><span class="dot" style="--fc:${fundColor(t.fund)}"></span>${esc(fundName(t.fund))}</span>`:"";
    const confirming=S.confirmDel===t.id;
    const acts=!S.canWrite?"":confirming?`<div class="acts"><button data-act="dodel" data-id="${t.id}" class="del">確定刪除</button><button data-act="nodel">取消</button></div>`
      :`<div class="acts"><button data-act="edit" data-id="${t.id}">編輯</button><button data-act="del" data-id="${t.id}" class="del">刪除</button></div>`;
    h+=`<div class="row ${confirming?"confirm":""}"><div class="d">${md(t.date)}</div>
      <div class="main"><div class="note">${esc(t.note||t.category||A.l)}</div><div class="meta"><span class="tag ${A.c}">${A.l}</span><span>${flow}</span>${fundTag}${t.type==="支出"&&t.category?`<span class="pill">${esc(t.category)}</span>`:""}</div></div>
      <div class="right"><span class="amt num ${ac}">${amt}</span>${run.has(t.id)?`<span class="run num">餘 ${money(run.get(t.id))}</span>`:""}${acts}</div></div>`;
  }
  $("#book").innerHTML=h;
}

/* ---------- sheet ---------- */
function openSheet(title,body,foot,onMount){
  $("#sheetHost").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h3>${esc(title)}</h3><button class="btn ghost" id="shClose" aria-label="關閉">✕</button></div><div class="sb">${body}</div>${foot?`<div class="sf">${foot}</div>`:""}</div></div>`;
  $("#shClose").onclick=closeSheet;
  $("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")closeSheet()});
  $$(".sheet .chips").forEach(g=>g.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;$$(".chip",g).forEach(x=>x.setAttribute("aria-pressed",x===b));g.dispatchEvent(new CustomEvent("pick",{detail:b.dataset.v}))}));
  onMount&&onMount();
}
function closeSheet(){$("#sheetHost").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#scrim"))closeSheet()});
const chips=(id,opts,sel)=>`<div class="chips" id="${id}" role="group">${opts.map(o=>`<button type="button" class="chip" data-v="${esc(o.v)}" aria-pressed="${o.v===sel}">${esc(o.l)}${o.s?`<small>${o.s}</small>`:""}</button>`).join("")}</div>`;
const pick=id=>{const b=$(`#${id} .chip[aria-pressed="true"]`);return b?b.dataset.v:""};
const setPick=(id,v)=>$$(`#${id} .chip`).forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===v));
const accChips=(id,kinds,sel,showBal)=>chips(id,accounts().filter(a=>kinds.includes(a.kind)&&(!a.archived||a.id===sel)).map(a=>({v:a.id,l:a.name,s:showBal?money(S.st.bal[a.id]):""})),sel);
const fundChips=(id,sel)=>chips(id,funds().map(f=>({v:f.id,l:f.name})),sel);

const TITLES={income:"收到錢",topup:"撥零用錢",spend:"記花費",settle:"月底結算",transfer:"帳戶之間轉帳",lend:"借出",repay:"收回借款"};

function openAction(action,tx){
  if(action==="lend"||action==="repay")action="transfer";
  const c=S.cfg;const edit=!!(tx&&tx.id);const t=Object.assign({date:todayStr(),amount:"",note:""},tx||{});
  const banks=accounts().filter(a=>a.kind==="bank");
  const defBank=c.defaultBank||(banks[0]&&banks[0].id);
  const bal=S.st.bal;const adv=advanceAcc();const owed=adv?Math.max(0,-bal[adv.id]):0;
  let body="",fields=[];
  const amountDate=(hint)=>`<div class="two"><div class="f"><label for="aAmt">金額（元）</label><input id="aAmt" class="big" inputmode="numeric" value="${esc(t.amount)}" placeholder="0" autocomplete="off">${hint?`<p class="hint">${hint}</p>`:""}</div><div class="f"><label for="aDate">日期</label><input id="aDate" type="date" value="${esc(t.date)}"></div></div>`;
  const note=(ph)=>`<div class="f"><label for="aNote">備註</label><input id="aNote" value="${esc(t.note)}" placeholder="${esc(ph)}"></div>`;
  if(action==="income"){
    const fund=t.fund||(funds()[0]&&funds()[0].id);const fd=fundById(fund);
    body=`<div class="f"><span class="lb">哪一筆錢</span>${fundChips("aFund",fund)}</div>
      <div class="f"><span class="lb">存進哪裡</span>${accChips("aTo",["bank","wallet"],t.to||(fd&&fd.defaultAcc)||defBank)}</div>
      ${amountDate()}${note("例如：9月育兒津貼、115年度宣穆基金")}`;
  }else if(action==="topup"){
    const w=t.to||(accounts().find(a=>a.kind==="wallet")||{}).id;
    if(!t.amount){const a=accById(w);if(a&&a.topup)t.amount=a.topup}
    body=`<div class="f"><span class="lb">撥給誰</span>${accChips("aTo",["wallet"],w,true)}</div>
      <div class="f"><span class="lb">從哪個帳戶撥</span>${accChips("aFrom",["bank"],t.from||defBank)}</div>
      <div class="f"><span class="lb">用哪一筆錢</span>${fundChips("aFund",t.fund||c.defaultSpendFund)}</div>
      ${amountDate()}${note("")}`;
  }else if(action==="spend"){
    const payer=t.from||(adv?adv.id:"");
    body=`<div class="f"><span class="lb">誰付的</span>${chips("aFrom",accounts().filter(a=>(a.kind==="wallet"||a.kind==="advance")&&(!a.archived||a.id===payer)).map(a=>({v:a.id,l:a.kind==="advance"?"我先刷卡／我的錢包":a.name})).concat(banks.filter(a=>!a.archived||a.id===payer).map(a=>({v:a.id,l:a.name,s:"直接從銀行付"}))),payer)}</div>
      <p class="hint" id="spHint"></p>
      <div class="f" id="fundWrap"><span class="lb">用哪一筆錢</span>${fundChips("aFund",t.fund||c.defaultSpendFund)}</div>
      ${amountDate()}
      <div class="f"><span class="lb">分類</span>${chips("aCat",(c.categories||["其他"]).map(x=>({v:x,l:x})),t.category||(c.categories||["其他"])[0])}</div>
      ${note("例如：尿布兩箱、腸病毒疫苗第二劑")}`;
  }else if(action==="settle"){
    const w=t.from||(settleWallet()||{}).id;
    if(!edit&&!t.amount&&owed)t.amount=owed;
    if(!edit&&!t.note)t.note=rocMonth(todayStr())+" 代墊結算";
    body=`<div class="callout">${owed?`你先墊的錢目前還有 <b class="num">${money(owed)}</b> 沒結算。按下結算後，這筆錢會從錢包扣掉，代墊歸零。`:`目前沒有記到代墊。如果你這個月是自己算好總額，直接輸入金額就好，會從錢包扣掉。`}</div>
      <div class="f"><span class="lb">從哪個錢包扣</span>${accChips("aFrom",["wallet"],w,true)}</div>
      ${amountDate(owed?"預設是全部代墊金額":"")}${note("")}`;
  }else{
    body=`<div class="f"><span class="lb">從</span>${accChips("aFrom",["bank","loan"],t.from||defBank,true)}</div>
      <div class="f"><span class="lb">轉到</span>${accChips("aTo",["bank","loan"],t.to||"")}</div>
      <div class="f"><span class="lb">這是哪一筆錢</span>${fundChips("aFund",t.fund||"")}<p class="hint">例如政府津貼從郵局轉到宣穆的投資戶，就選「政府津貼」。</p></div>
      ${amountDate()}${note("例如：津貼轉投資戶")}`;
  }
  body+=`<div class="err" id="aErr" role="alert"></div>`;
  openSheet((edit?"編輯・":"")+TITLES[action],body,`<button class="btn" id="aCancel">取消</button><button class="btn primary" id="aSave">${edit?"儲存修改":"記下來"}</button>`,()=>{
    $("#aCancel").onclick=closeSheet;
    if(action==="topup")$("#aTo").addEventListener("pick",e=>{const a=accById(e.detail);if(a&&a.topup)$("#aAmt").value=a.topup});
    if(action==="spend"){const upd=()=>{const p=pick("aFrom");$("#fundWrap").hidden=!isBank(p);
      $("#spHint").textContent=kind(p)==="advance"?"先記下來，月底按「月底結算」一次從共同錢包扣回。":kind(p)==="wallet"?"錢包的錢撥進去時已經算用掉，這裡只會減少錢包剩餘。也可以月底記一筆總額。":"直接從銀行帳戶付，會算進所選基金的支出。"};
      upd();$("#aFrom").addEventListener("pick",upd)}

      else if(action==="settle"){r.type="轉帳";r.from=pick("aFrom");r.to=adv?adv.id:"";r.fund="";r.category="";if(!r.from)return err.textContent="請選擇錢包。";if(!adv)return err.textContent="請先在設定裡加一個「我先墊」帳戶。"}
      else{r.type="轉帳";r.from=pick("aFrom");r.to=pick("aTo");r.fund=pick("aFund");r.category="";if(!r.from||!r.to)return err.textContent="請選擇兩個帳戶。";if(r.from===r.to)return err.textContent="轉出和轉入不能是同一個帳戶。"}
      $("#aSave").disabled=true;
      try{const now=Date.now();
        if(edit)await S.db.doc("tx/"+t.id).set(Object.assign(docBody(S.tx.get(t.id)),r,{updatedAt:now}));
        else await S.db.collection("tx").doc().set(Object.assign(r,{createdAt:now,updatedAt:now}));
        closeSheet();toast(edit?"已儲存修改":`已記下${TITLES[action]} ${money(amount)}`);
      }catch(e){$("#aSave").disabled=false;writeError(e,err)}
    };
    if(!edit)setTimeout(()=>{const a=$("#aAmt");if(a&&!a.value)a.focus()},60);
  });
}

function writeError(e,el){
  const code=e&&e.code;
  const m=(code==="invalid_argument"||code==="permission-denied")?"你沒有修改這本帳的權限。":code==="quota_exceeded"?"資料已達上限，請先清空垃圾桶。":code==="revoked"?"連線權限已失效，請重新整理頁面。":"存檔失敗，請檢查網路後再試一次。";
  if(el)el.textContent=m;else toast(m);
  if(code==="invalid_argument"||code==="permission-denied"){S.canWrite=false;render()}
}

      const rows=liveTx().sort((a,b)=>sortKey(a)<sortKey(b)?-1:1).map(t=>[t.date,ACT[actionOf(t)].l,t.amount,label(t.from),t.type==="支出"?"":label(t.to),t.fund?fundName(t.fund):"",t.category,t.note].map(q).join(","));
      save(`${S.cfg.title||"金庫"}_${todayStr()}.csv`,"﻿"+[["日期","類型","金額","從","到","哪一筆錢","分類","備註"].map(q).join(",")].concat(rows).join("\r\n"))};

    const fi=$("#bFile");if(fi)fi.onchange=()=>{const file=fi.files[0];if(!file)return;const rd=new FileReader();
      rd.onload=()=>{let j;try{j=JSON.parse(rd.result)}catch(e){$("#bPrev").innerHTML=`<p class="err">這個檔案不是正確的 JSON 備份檔。</p>`;return}
        const src=Array.isArray(j)?j:j.transactions;if(!Array.isArray(src)){$("#bPrev").innerHTML=`<p class="err">檔案裡找不到收支紀錄。</p>`;return}
        const needCfg=!!(j.config&&!(S.cfg.accounts||[]).length);if(needCfg)S.cfg=j.config;
        const conv=src.map(convertOld).filter(Boolean);const fresh=conv.filter(t=>!S.tx.has(t.id));
        $("#bPrev").innerHTML=`<p style="margin:0">檔案裡有 <b class="num">${conv.length}</b> 筆，其中 <b class="num">${fresh.length}</b> 筆是新的。</p>${needCfg?`<p class="hint" style="margin:0">也會匯入帳戶、基金和分類設定。</p>`:""}${fresh.length||needCfg?`<button class="btn primary" id="bDo">匯入 ${fresh.length} 筆</button>`:""}`;
        const b=$("#bDo");if(b)b.onclick=async()=>{b.disabled=true;let n=0;try{if(needCfg)await S.cfgRef.set(clone(j.config));for(const t of fresh){const id=t.id,d=Object.assign({},t);delete d.id;await S.db.doc("tx/"+id).set(d);n++;b.textContent=`匯入中 ${n}/${fresh.length}`}closeSheet();toast(`已匯入 ${n} 筆`)}catch(e){writeError(e,null);b.textContent=`已匯入 ${n} 筆，其餘失敗`}}};
      rd.readAsText(file)};
  });
}
const safeId=s=>String(s).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_").slice(0,120);
function nameToId(n){if(!n)return null;const cl=s=>String(s).replace(/[\s💳]/g,"").toLowerCase();const al=(S.cfg.accountAlias||{})[n];if(al&&accById(al))return al;const a=accounts().find(a=>cl(a.name)===cl(n));return a?a.id:null}
function convertOld(o,i){
  if(!o||!o.date||!o.amount)return null;
  if(o.from!==undefined&&!o.sourceAccount)return Object.assign({},o,{id:safeId(o.id||("imp-"+i))});
  const fi=nameToId(o.sourceAccount),ti=nameToId(o.targetAccount);let type=o.type||"支出";
  if(type==="支出"&&fi&&ti&&fi!==ti)type="轉帳";
  const fund=(S.cfg.fundAlias||{})[o.fund]||"";
  const t={id:safeId(o.id||("imp-"+i)),type,amount:Math.round(Number(o.amount)),date:o.date,from:fi||o.sourceAccount||"",to:ti||o.targetAccount||"",category:o.category||"其他",fund,note:o.note||"",createdAt:Date.parse(o.date)||0,updatedAt:Date.now()};
  if(type==="收入"&&(fi===ti||!fi))t.from=fundName(fund);
  if(type!=="收入"&&!isBank(t.from)&&type!=="轉帳")t.fund="";
  return t;
}

function makeDb(fs){
  const WAIT=1500; // offline: the write is queued locally and uploads later
  const w=p=>{p.catch(e=>writeError({code:e&&e.code}));return Promise.race([p,new Promise(r=>setTimeout(r,WAIT))])};
  const wrapDoc=ref=>({id:ref.id,set:d=>w(setDoc(ref,d)),delete:()=>w(deleteDoc(ref)),
    onSnapshot:(n,e)=>fsSnap(ref,s=>n({exists:s.exists(),data:()=>s.data()}),e)});
  return {doc:p=>wrapDoc(fsDoc(fs,p)),collection:p=>{const c=fsCol(fs,p);return{
    doc:id=>wrapDoc(id?fsDoc(c,id):fsDoc(c)),
    limit:n=>({onSnapshot:(nx,e)=>fsSnap(query(c,fsLimit(n)),s=>nx({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)})}}};
}

  try{await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,$("#lEmail").value.trim(),$("#lPw").value)}
  catch(err){$("#lErr").textContent=/network/.test(err.code||"")?"連不上網路，請稍後再試。":"Email 或密碼不正確。"}finally{$("#lGo").disabled=false}});
$("#btnOut").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
  unsubs.forEach(u=>u());unsubs=[];S.loadedCfg=S.loadedTx=false;
  if(!user){$("#login").hidden=false;$("#status").hidden=true;$("#app").hidden=true;$("#toolbar").hidden=true;return}
  $("#login").hidden=true;$("#status").hidden=false;$("#status").textContent="正在讀取帳本…";
  const db=makeDb(fs);S.db=db;S.cfgRef=db.doc("config/main");S.canWrite=true;
  const fail=e=>{$("#status").hidden=false;$("#app").hidden=true;$("#status").textContent=e&&e.code==="permission-denied"?"這個帳號沒有權限打開帳本。請確認 Firestore 的安全規則裡有你的 Email。":"讀取資料失敗，請重新整理頁面。"};
  unsubs.push(S.cfgRef.onSnapshot(snap=>{
    S.cfg=snap.exists?snap.data():{title:"小萌馬金庫",child:"",accounts:[],funds:[],categories:["其他"]};
    S.loadedCfg=true;render();
  },fail));
  unsubs.push(db.collection("tx").limit(1000).onSnapshot(snap=>{S.tx=new Map(snap.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));S.loadedTx=true;render()},fail));
});
})();
</script>
</body>
</html>
